name: Native npm release

on:
  workflow_dispatch:
    inputs:
      thread_ui_sha:
        description: Full commit SHA from remote-codex-thread-ui-rust to release
        required: true
        type: string
      channel:
        description: Package only, publish to next, or promote a stable release
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - next
          - latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: native-npm-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: 1.89.0
  THREAD_UI_REPO: https://github.com/dufangshi/remote-codex-thread-ui-rust.git

jobs:
  verify:
    name: Release test gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "${RUST_VERSION}" --profile minimal
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: release-test
          cmd-format: rustup run ${{ env.RUST_VERSION }} {0}

      - name: Test workspace and migrations
        run: cargo +${{ env.RUST_VERSION }} test --workspace --locked

  native:
    name: Native ${{ matrix.key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            cargo_target: aarch64-apple-darwin
            binary: remote-codex
            runnable: true
            linux: false
          - key: linux-arm64-gnu
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu.2.28
            cargo_target: aarch64-unknown-linux-gnu
            binary: remote-codex
            runnable: false
            linux: true
          - key: linux-x64-gnu
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu.2.28
            cargo_target: x86_64-unknown-linux-gnu
            binary: remote-codex
            runnable: true
            linux: true
          - key: win32-x64-msvc
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            cargo_target: x86_64-pc-windows-msvc
            binary: remote-codex.exe
            runnable: true
            linux: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target '${{ matrix.cargo_target }}'

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: release-${{ matrix.key }}-${{ matrix.target }}-zigbuild-0.23.4-macos-12.0
          cmd-format: rustup run ${{ env.RUST_VERSION }} {0}

      - name: Install Linux Zig linker
        if: matrix.linux
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install cargo-zigbuild
        if: matrix.linux
        shell: bash
        run: python -m pip install 'cargo-zigbuild==0.23.4'

      - name: Build native executable
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          set -euo pipefail
          if [ '${{ matrix.linux }}' = 'true' ]; then
            cargo +"${RUST_VERSION}" zigbuild --locked --release --package remote-codex --target '${{ matrix.target }}'
          else
            cargo +"${RUST_VERSION}" build --locked --release --package remote-codex --target '${{ matrix.target }}'
          fi

      - name: Smoke native executable
        if: matrix.runnable
        shell: bash
        run: target/'${{ matrix.cargo_target }}'/release/'${{ matrix.binary }}' version

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'artifacts/${{ matrix.key }}'
          cp 'target/${{ matrix.cargo_target }}/release/${{ matrix.binary }}' 'artifacts/${{ matrix.key }}/${{ matrix.binary }}'
          if [ '${{ runner.os }}' != 'Windows' ]; then
            chmod 0755 'artifacts/${{ matrix.key }}/${{ matrix.binary }}'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}
          path: artifacts/${{ matrix.key }}/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  web:
    name: Build Web assets
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Check out thread UI
        shell: bash
        env:
          THREAD_UI_SHA: ${{ inputs.thread_ui_sha }}
        run: |
          set -euo pipefail
          [[ "${THREAD_UI_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full UI commit SHA is required' >&2; exit 1; }
          git init ./remote-codex-thread-ui
          git -C ./remote-codex-thread-ui remote add origin "${THREAD_UI_REPO}"
          git -C ./remote-codex-thread-ui fetch --depth 1 origin "${THREAD_UI_SHA}"
          git -C ./remote-codex-thread-ui checkout --detach FETCH_HEAD
          test "$(git -C ./remote-codex-thread-ui rev-parse HEAD)" = "${THREAD_UI_SHA}"
          echo "Thread UI: ${THREAD_UI_SHA}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build Web assets for the npm launcher
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir ./remote-codex-thread-ui install --frozen-lockfile
          pnpm --dir ./remote-codex-thread-ui --filter @remote-codex/thread-ui build
          pnpm install --frozen-lockfile
          pnpm --filter @remote-codex/supervisor-web build

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/supervisor-web/dist/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Assemble and verify npm packages
    needs: [verify, native, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps/supervisor-web/dist

      - uses: actions/download-artifact@v4
        with:
          pattern: '{darwin-arm64,linux-arm64-gnu,linux-x64-gnu,win32-x64-msvc}'
          path: artifacts/native

      - name: Prepare and pack release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-npm-release.mjs --artifacts-dir artifacts/native --require-all
          node scripts/verify-npm-package.mjs --prepared
          node scripts/pack-npm-release.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: remote-codex-npm-${{ github.sha }}
          path: dist/npm/
          if-no-files-found: error
          retention-days: 14

  release:
    if: inputs.channel != 'dry-run'
    name: Publish GitHub native assets
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or verify immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          mkdir -p release-assets
          for key in darwin-arm64 linux-arm64-gnu linux-x64-gnu; do
            cp "artifacts/${key}/remote-codex" "release-assets/remote-codex-${key}"
            chmod 0755 "release-assets/remote-codex-${key}"
          done
          cp artifacts/win32-x64-msvc/remote-codex.exe release-assets/remote-codex-win32-x64-msvc-cli.exe
          (cd release-assets && sha256sum remote-codex-* > SHA256SUMS)

          if gh release view "${tag}" >/dev/null 2>&1; then
            target=$(gh release view "${tag}" --json targetCommitish --jq .targetCommitish)
            test "${target}" = "${GITHUB_SHA}" || {
              echo "Release ${tag} targets ${target}, expected ${GITHUB_SHA}" >&2
              exit 1
            }
            mkdir existing-assets
            gh release download "${tag}" --dir existing-assets
            for asset in release-assets/*; do
              cmp "${asset}" "existing-assets/$(basename "${asset}")"
            done
          else
            gh release create "${tag}" release-assets/* \
              --target "${GITHUB_SHA}" \
              --title "Remote Codex ${version}" \
              --notes "Rust supervisor and relay runtime release. The Windows CLI asset uses the -cli suffix; the separately released Device Manager updates this runtime through npm. Native binaries are unsigned; verify downloads with SHA256SUMS."
          fi

  publish:
    if: inputs.channel != 'dry-run'
    name: Publish npm ${{ inputs.channel }}
    needs: [package, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.19.1

      - uses: actions/download-artifact@v4
        with:
          name: remote-codex-npm-${{ github.sha }}
          path: dist/npm

      - name: Publish native packages before launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REMOTE_CODEX_ALLOW_LATEST: ${{ inputs.channel == 'latest' && '1' || '0' }}
        run: node scripts/publish-npm-release.mjs '${{ inputs.channel }}'
