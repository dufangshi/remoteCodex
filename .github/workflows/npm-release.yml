name: Native npm release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Package only, publish to next, or promote a stable release
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - next
          - latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: native-npm-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: 1.89.0
  THREAD_UI_REPO: https://github.com/dufangshi/remote-codex-thread-ui-rust.git
  THREAD_UI_REF: main

jobs:
  verify:
    name: Release test gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "${RUST_VERSION}" --profile minimal
      - name: Test workspace and migrations
        run: cargo +${{ env.RUST_VERSION }} test --workspace --locked

  native:
    name: Native ${{ matrix.key }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            cargo_target: aarch64-apple-darwin
            binary: remote-codex
            runnable: true
            linux: false
          - key: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            cargo_target: x86_64-apple-darwin
            binary: remote-codex
            runnable: true
            linux: false
          - key: linux-arm64-gnu
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu.2.28
            cargo_target: aarch64-unknown-linux-gnu
            binary: remote-codex
            runnable: false
            linux: true
          - key: linux-arm64-musl
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            cargo_target: aarch64-unknown-linux-musl
            binary: remote-codex
            runnable: false
            linux: true
          - key: linux-x64-gnu
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu.2.28
            cargo_target: x86_64-unknown-linux-gnu
            binary: remote-codex
            runnable: true
            linux: true
          - key: linux-x64-musl
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            cargo_target: x86_64-unknown-linux-musl
            binary: remote-codex
            runnable: true
            linux: true
          - key: win32-x64-msvc
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            cargo_target: x86_64-pc-windows-msvc
            binary: remote-codex.exe
            runnable: true
            linux: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        if: matrix.key == 'win32-x64-msvc'
        with:
          dotnet-version: '8.0.x'

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target '${{ matrix.cargo_target }}'

      - name: Install Linux Zig linker
        if: matrix.linux
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install cargo-zigbuild
        if: matrix.linux
        shell: bash
        run: python -m pip install 'cargo-zigbuild==0.23.4'

      - name: Build native executable
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          set -euo pipefail
          if [ '${{ matrix.linux }}' = 'true' ]; then
            cargo +"${RUST_VERSION}" zigbuild --locked --release --package remote-codex --target '${{ matrix.target }}'
          else
            cargo +"${RUST_VERSION}" build --locked --release --package remote-codex --target '${{ matrix.target }}'
          fi

      - name: Smoke native executable
        if: matrix.runnable
        shell: bash
        run: target/'${{ matrix.cargo_target }}'/release/'${{ matrix.binary }}' version

      - name: Build and verify Windows Device Manager
        if: matrix.key == 'win32-x64-msvc'
        shell: pwsh
        run: ./scripts/windows/build-device-manager.ps1 -BundledRemoteCodexBinary "target/${{ matrix.cargo_target }}/release/remote-codex.exe"

      - name: Sign Windows Device Manager when a certificate is configured
        if: matrix.key == 'win32-x64-msvc'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)) {
            Write-Host 'Windows signing certificate is not configured; keeping the verified unsigned artifact.'
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'remote-codex-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          try {
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) { throw 'signtool.exe was not found.' }
            $executable = 'artifacts\windows-device-manager\win-x64\RemoteCodex.DeviceManager.exe'
            & $signTool.FullName sign /sha1 $certificate.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $executable
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE." }
            & $signTool.FullName verify /pa /v $executable
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed with exit code $LASTEXITCODE." }
            $hash = Get-FileHash -LiteralPath $executable -Algorithm SHA256
            $hashLine = '{0}  RemoteCodex.DeviceManager.exe' -f $hash.Hash.ToLowerInvariant()
            [IO.File]::WriteAllText(
              'artifacts\windows-device-manager\win-x64\RemoteCodex.DeviceManager.exe.sha256',
              "$hashLine`n",
              [Text.UTF8Encoding]::new($false)
            )
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
            if ($certificate) {
              Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'artifacts/${{ matrix.key }}'
          cp 'target/${{ matrix.cargo_target }}/release/${{ matrix.binary }}' 'artifacts/${{ matrix.key }}/${{ matrix.binary }}'
          if [ '${{ runner.os }}' != 'Windows' ]; then
            chmod 0755 'artifacts/${{ matrix.key }}/${{ matrix.binary }}'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}
          path: artifacts/${{ matrix.key }}/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: matrix.key == 'win32-x64-msvc'
        with:
          name: windows-device-manager
          path: artifacts/windows-device-manager/win-x64/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Assemble and verify npm packages
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Check out thread UI
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${THREAD_UI_REF}" "${THREAD_UI_REPO}" ./remote-codex-thread-ui
          echo "Thread UI: $(git -C ./remote-codex-thread-ui rev-parse HEAD)" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build Web assets for the npm launcher
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir ./remote-codex-thread-ui install --frozen-lockfile
          pnpm --dir ./remote-codex-thread-ui --filter @remote-codex/thread-ui build
          pnpm install --frozen-lockfile
          pnpm --filter @remote-codex/supervisor-web build

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/native

      - name: Prepare and pack release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-npm-release.mjs --artifacts-dir artifacts/native --require-all
          node scripts/verify-npm-package.mjs --prepared
          node scripts/pack-npm-release.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: remote-codex-npm-${{ github.sha }}
          path: dist/npm/
          if-no-files-found: error
          retention-days: 14

  release:
    if: inputs.channel != 'dry-run'
    name: Publish GitHub native assets
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or verify immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          mkdir -p release-assets
          for key in darwin-arm64 darwin-x64 linux-arm64-gnu linux-arm64-musl linux-x64-gnu linux-x64-musl; do
            cp "artifacts/${key}/remote-codex" "release-assets/remote-codex-${key}"
            chmod 0755 "release-assets/remote-codex-${key}"
          done
          cp artifacts/win32-x64-msvc/remote-codex.exe release-assets/remote-codex-win32-x64-msvc-cli.exe
          cp artifacts/windows-device-manager/RemoteCodex.DeviceManager.exe release-assets/remote-codex-win32-x64-msvc.exe
          (cd release-assets && sha256sum remote-codex-* > SHA256SUMS)

          if gh release view "${tag}" >/dev/null 2>&1; then
            target=$(gh release view "${tag}" --json targetCommitish --jq .targetCommitish)
            test "${target}" = "${GITHUB_SHA}" || {
              echo "Release ${tag} targets ${target}, expected ${GITHUB_SHA}" >&2
              exit 1
            }
            mkdir existing-assets
            gh release download "${tag}" --dir existing-assets
            for asset in release-assets/*; do
              cmp "${asset}" "existing-assets/$(basename "${asset}")"
            done
          else
            gh release create "${tag}" release-assets/* \
              --target "${GITHUB_SHA}" \
              --title "Remote Codex ${version}" \
              --notes "Rust supervisor and relay release. The Windows asset without the -cli suffix is the native Relay Device Manager. Native binaries are unsigned; verify downloads with SHA256SUMS."
          fi

  publish:
    if: inputs.channel != 'dry-run'
    name: Publish npm ${{ inputs.channel }}
    needs: [package, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.19.1

      - uses: actions/download-artifact@v4
        with:
          name: remote-codex-npm-${{ github.sha }}
          path: dist/npm

      - name: Publish native packages before launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REMOTE_CODEX_ALLOW_LATEST: ${{ inputs.channel == 'latest' && '1' || '0' }}
        run: node scripts/publish-npm-release.mjs '${{ inputs.channel }}'
