name: Platform compatibility

on:
  pull_request:
  push:
    branches:
      - main
      - rust/acp-rewrite
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: 1.89.0
  THREAD_UI_REPO: https://github.com/dufangshi/remote-codex-thread-ui-rust.git
  THREAD_UI_REF: main

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "${RUST_VERSION}" --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +${{ env.RUST_VERSION }} fmt --all --check

      - name: Test workspace
        run: cargo +${{ env.RUST_VERSION }} test --workspace --locked

      - name: Clippy workspace
        run: cargo +${{ env.RUST_VERSION }} clippy --workspace --all-targets --locked

      - name: Build Windows release executable
        if: runner.os == 'Windows'
        run: cargo +${{ env.RUST_VERSION }} build --locked --release --package remote-codex

      - name: Smoke Windows release executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $metadata = cargo +${{ env.RUST_VERSION }} metadata --no-deps --format-version 1 | ConvertFrom-Json
          $expected = ($metadata.packages | Where-Object { $_.name -eq 'remote-codex' }).version
          $version = & target/release/remote-codex.exe version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne $expected) {
            throw "Unexpected remote-codex.exe version: $version"
          }

      - name: Upload Windows release executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: remote-codex-windows-x64-${{ github.sha }}
          path: target/release/remote-codex.exe
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web and npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Check out thread UI
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${THREAD_UI_REF}" "${THREAD_UI_REPO}" ./remote-codex-thread-ui
          echo "Thread UI: $(git -C ./remote-codex-thread-ui rev-parse HEAD)" >> "${GITHUB_STEP_SUMMARY}"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir ./remote-codex-thread-ui install --frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Build thread UI before supervisor validation
        run: pnpm --dir ./remote-codex-thread-ui --filter @remote-codex/thread-ui build

      - name: Typecheck and test Web
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @remote-codex/supervisor-web typecheck
          pnpm --filter @remote-codex/supervisor-web test
          pnpm --filter @remote-codex/supervisor-web build

      - name: Validate Incus host agent
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @remote-codex/incus-host-agent typecheck
          pnpm --filter @remote-codex/incus-host-agent test
          pnpm --filter @remote-codex/incus-host-agent build
          bash -n packages/incus-host-agent/deploy/*.sh
          bash -n packages/incus-host-agent/guest/*.sh packages/incus-host-agent/guest/remote-codex-provision

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          cargo +"${RUST_VERSION}" build --locked --release --package remote-codex

      - name: Verify installed npm product
        run: node scripts/verify-npm-package.mjs
