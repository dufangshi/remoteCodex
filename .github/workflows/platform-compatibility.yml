name: Platform compatibility

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Configure thread-ui package access
        shell: bash
        env:
          REMOTE_CODEX_THREAD_UI_DEPLOY_KEY_B64: ${{ secrets.REMOTE_CODEX_THREAD_UI_DEPLOY_KEY_B64 }}
        run: bash scripts/setup-thread-ui-git-auth.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install thread-ui workspace dependencies
        shell: bash
        run: pnpm --dir ../remote-codex-thread-ui install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test backend and platform packages
        run: pnpm -r --filter '!@remote-codex/supervisor-web' --if-present test

      - name: Test supervisor web outside known thread-ui baseline failures
        run: pnpm --filter @remote-codex/supervisor-web exec vitest run --exclude src/components/ThreadTimeline.test.tsx

      - name: Relay supervisor end-to-end smoke
        run: pnpm verify:relay

  windows-package-smoke:
    name: Windows production package smoke
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Configure thread-ui package access
        shell: bash
        env:
          REMOTE_CODEX_THREAD_UI_DEPLOY_KEY_B64: ${{ secrets.REMOTE_CODEX_THREAD_UI_DEPLOY_KEY_B64 }}
        run: bash scripts/setup-thread-ui-git-auth.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install thread-ui workspace dependencies
        shell: bash
        run: pnpm --dir ../remote-codex-thread-ui install --frozen-lockfile

      - name: Build thread-ui workspace packages
        shell: bash
        run: pnpm --dir ../remote-codex-thread-ui build

      - name: Verify packed installation and graceful shutdown
        run: pnpm verify:package
