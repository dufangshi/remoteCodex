name: Platform compatibility

on:
  pull_request:
  push:
    branches:
      - main
      - rust/acp-rewrite
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.89.0
  THREAD_UI_REPO: https://github.com/dufangshi/remote-codex-thread-ui-rust.git
  THREAD_UI_REF: main

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      windows_manager: ${{ steps.filter.outputs.windows_manager }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - '.cargo/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/**'
              - 'migrations/**'
            web:
              - 'apps/supervisor-web/**'
              - 'e2e/**'
              - 'npm/**'
              - 'package.json'
              - 'packages/**'
              - 'playwright.config.*'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/*.mjs'
              - 'tsconfig*.json'
            windows_manager:
              - '.github/workflows/platform-compatibility.yml'
              - 'apps/windows-device-manager/**'
              - 'scripts/windows/**'

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "${RUST_VERSION}" --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo +${{ env.RUST_VERSION }} fmt --all --check

      - name: Test workspace
        run: cargo +${{ env.RUST_VERSION }} test --workspace --locked

      - name: Clippy workspace
        if: runner.os == 'Linux'
        run: cargo +${{ env.RUST_VERSION }} clippy --workspace --all-targets --locked

  windows-manager:
    name: Windows Device Manager
    needs: changes
    if: needs.changes.outputs.windows_manager == 'true'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "${RUST_VERSION}" --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-device-manager
          cache-on-failure: true

      - name: Build and verify Device Manager
        shell: pwsh
        run: ./scripts/windows/build-device-manager.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-device-manager-${{ github.sha }}
          path: artifacts/windows-device-manager/win-x64/
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web and npm package
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Check out thread UI
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${THREAD_UI_REF}" "${THREAD_UI_REPO}" ./remote-codex-thread-ui
          echo "Thread UI: $(git -C ./remote-codex-thread-ui rev-parse HEAD)" >> "${GITHUB_STEP_SUMMARY}"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir ./remote-codex-thread-ui install --frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Build thread UI before supervisor validation
        run: pnpm --dir ./remote-codex-thread-ui --filter @remote-codex/thread-ui build

      - name: Typecheck and test Web
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @remote-codex/supervisor-web typecheck
          pnpm --filter @remote-codex/supervisor-web test
          pnpm --filter @remote-codex/supervisor-web build

      - name: Validate Incus host agent
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @remote-codex/incus-host-agent typecheck
          pnpm --filter @remote-codex/incus-host-agent test
          pnpm --filter @remote-codex/incus-host-agent build
          bash -n packages/incus-host-agent/deploy/*.sh
          bash -n packages/incus-host-agent/guest/*.sh packages/incus-host-agent/guest/remote-codex-provision

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          cargo +"${RUST_VERSION}" build --locked --release --package remote-codex

      - name: Verify installed npm product
        run: node scripts/verify-npm-package.mjs
