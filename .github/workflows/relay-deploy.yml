name: Relay Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: relay-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  RELAY_CONTAINER_NAME: remote-codex-relay
  RELAY_HOST_PORT: '8798'

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    name: Build and push relay image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image_sha: ${{ steps.image.outputs.image_sha }}
      image_latest: ${{ steps.image.outputs.image_latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_base="$(printf '%s/%s-relay' "${REGISTRY}" "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image_sha=${image_base}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "image_latest=${image_base}:latest" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push relay
        uses: docker/build-push-action@v5
        env:
          REMOTE_CODEX_THREAD_UI_DEPLOY_KEY_B64: ${{ secrets.REMOTE_CODEX_THREAD_UI_DEPLOY_KEY_B64 }}
        with:
          context: .
          file: Dockerfile.relay
          push: true
          secret-envs: |
            remote_codex_thread_ui_deploy_key=REMOTE_CODEX_THREAD_UI_DEPLOY_KEY_B64
          build-args: |
            REMOTE_CODEX_THREAD_UI_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          tags: |
            ${{ steps.image.outputs.image_latest }}
            ${{ steps.image.outputs.image_sha }}

  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy relay over SSH
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 30

    steps:
      - name: Deploy relay container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_HOST }}
          username: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_USER }}
          password: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_PASSWORD }}
          port: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_PORT }}
          timeout: 60m
          command_timeout: 20m
          script: |
            set -euo pipefail

            image="${{ needs.build-and-push.outputs.image_sha }}"
            container="${{ env.RELAY_CONTAINER_NAME }}"
            host_port="${{ env.RELAY_HOST_PORT }}"
            data_volume="${{ env.RELAY_CONTAINER_NAME }}-data"
            hosted_relay_url="${{ secrets.REMOTE_CODEX_HOSTED_RELAY_SERVER_URL }}"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "${image}"

            old_relay_pids="$(
              ps -eo pid=,args= \
                | awk '($0 ~ /node .*remote-codex relay/ || $0 ~ /node .*apps\/relay-server\/dist\/index.js/) && $0 !~ /awk/ { print $1 }'
            )"
            if [ -n "${old_relay_pids}" ]; then
              echo "Stopping existing remote-codex relay processes: ${old_relay_pids}"
              kill ${old_relay_pids} 2>/dev/null || true
              sleep 2
              for pid in ${old_relay_pids}; do
                if kill -0 "${pid}" 2>/dev/null; then
                  kill -9 "${pid}" 2>/dev/null || true
                fi
              done
            fi

            docker rm -f "${container}" 2>/dev/null || true

            relay_ids="$(docker ps -aq --filter "label=app=remote-codex-relay" || true)"
            if [ -n "${relay_ids}" ]; then
              docker rm -f ${relay_ids}
            fi

            docker volume create "${data_volume}" >/dev/null
            docker network inspect remote-codex-relay-net >/dev/null 2>&1 || \
              docker network create \
                --driver bridge \
                --subnet 172.30.0.0/24 \
                --gateway 172.30.0.1 \
                remote-codex-relay-net >/dev/null

            hosted_args=(--network remote-codex-relay-net)
            if [ -n "${hosted_relay_url}" ] \
              && sudo test -r /etc/remote-codex/incus-host-agent.env \
              && sudo systemctl is-active --quiet remote-codex-incus-host-agent.service; then
              host_agent_token="$(sudo sed -n 's/^REMOTE_CODEX_INCUS_HOST_AGENT_TOKEN=//p' /etc/remote-codex/incus-host-agent.env)"
              if [ -n "${host_agent_token}" ] \
                && curl -fsS -H "authorization: Bearer ${host_agent_token}" \
                  http://172.30.0.1:8801/readyz >/dev/null; then
                hosted_args+=(
                  -e REMOTE_CODEX_HOSTED_SANDBOX_PROVIDER=incus
                  -e REMOTE_CODEX_INCUS_HOST_AGENT_URL=http://172.30.0.1:8801
                  -e "REMOTE_CODEX_INCUS_HOST_AGENT_TOKEN=${host_agent_token}"
                  -e "REMOTE_CODEX_HOSTED_RELAY_SERVER_URL=${hosted_relay_url}"
                  -e REMOTE_CODEX_HOSTED_IDLE_TIMEOUT_MS=1800000
                  -e REMOTE_CODEX_HOSTED_RECONCILE_INTERVAL_MS=300000
                )
                echo "Hosted supervisor provider enabled."
              else
                echo "Hosted supervisor provider unavailable; deploying relay with it disabled."
              fi
            else
              echo "Hosted supervisor provider not configured; deploying relay with it disabled."
            fi

            docker run -d \
              --name "${container}" \
              --label app=remote-codex-relay \
              --restart unless-stopped \
              "${hosted_args[@]}" \
              -p "0.0.0.0:${host_port}:8788" \
              -v "${data_volume}:/var/lib/remote-codex-relay" \
              -e REMOTE_CODEX_RELAY_HOST=0.0.0.0 \
              -e REMOTE_CODEX_RELAY_PORT=8788 \
              -e HOST=0.0.0.0 \
              -e PORT=8788 \
              -e REMOTE_CODEX_RELAY_DATA_DIR=/var/lib/remote-codex-relay \
              -e REMOTE_CODEX_RELAY_REGISTRATION_ENABLED=true \
              -e REMOTE_CODEX_RELAY_REGISTRATION_PASSWORD="${{ secrets.REMOTE_CODEX_RELAY_REGISTRATION_PASSWORD }}" \
              -e REMOTE_CODEX_ADMIN_USERNAME="${{ secrets.REMOTE_CODEX_RELAY_ADMIN_USERNAME }}" \
              -e REMOTE_CODEX_ADMIN_PASSWORD="${{ secrets.REMOTE_CODEX_RELAY_ADMIN_PASSWORD }}" \
              -e REMOTE_CODEX_RELAY_SESSION_SECRET="${{ secrets.REMOTE_CODEX_RELAY_SESSION_SECRET }}" \
              -e REMOTE_CODEX_PUBLIC_BASE_URL="${{ secrets.REMOTE_CODEX_HOSTED_RELAY_SERVER_URL }}" \
              -e REMOTE_CODEX_GOOGLE_OAUTH_CLIENT_ID="${{ secrets.REMOTE_CODEX_GOOGLE_OAUTH_CLIENT_ID }}" \
              -e REMOTE_CODEX_GOOGLE_OAUTH_CLIENT_SECRET="${{ secrets.REMOTE_CODEX_GOOGLE_OAUTH_CLIENT_SECRET }}" \
              -e REMOTE_CODEX_GOOGLE_OAUTH_ENABLED=true \
              -e REMOTE_CODEX_GITHUB_OAUTH_CLIENT_ID="${{ secrets.REMOTE_CODEX_GITHUB_OAUTH_CLIENT_ID }}" \
              -e REMOTE_CODEX_GITHUB_OAUTH_CLIENT_SECRET="${{ secrets.REMOTE_CODEX_GITHUB_OAUTH_CLIENT_SECRET }}" \
              -e REMOTE_CODEX_GITHUB_OAUTH_ENABLED=true \
              "${image}"

            for attempt in $(seq 1 45); do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${container}" 2>/dev/null || true)"
              if [ "${health}" = "healthy" ] || [ "${health}" = "running" ]; then
                docker ps --filter "name=^/${container}$"
                exit 0
              fi
              docker logs --tail 50 "${container}" || true
              sleep 2
            done

            docker logs --tail 200 "${container}" || true
            exit 1

  deploy-rust-rewrite:
    if: github.ref == 'refs/heads/rust/acp-rewrite'
    name: Deploy Rust relay to remote.lnz-study.com
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture deployment boundaries
        id: before
        shell: bash
        run: |
          set -euo pipefail
          legacy_asset="$(curl -fsS https://remote-codex.lnz-study.com/ | sed -n 's#.*src="\(/assets/index-[^"]*\.js\)".*#\1#p' | head -n 1)"
          test -n "${legacy_asset}"
          echo "legacy_asset=${legacy_asset}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust relay release image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.relay
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            REMOTE_CODEX_THREAD_UI_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=rust-relay
          cache-to: type=gha,mode=max,scope=rust-relay
          tags: remote-codex-rust-relay:${{ github.sha }}

      - name: Package Rust relay artifacts
        id: package
        shell: bash
        run: |
          set -euo pipefail
          image="remote-codex-rust-relay:${GITHUB_SHA}"
          container="remote-codex-rust-relay-extract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_dir="rust-relay-artifact"
          archive="remote-codex-rust-relay-${GITHUB_SHA}.tgz"

          mkdir -p "${artifact_dir}/web"
          docker create --name "${container}" "${image}" >/dev/null
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT
          docker cp "${container}:/usr/local/bin/remote-codex" "${artifact_dir}/remote-codex"
          docker cp "${container}:/opt/remote-codex/apps/supervisor-web/dist/." "${artifact_dir}/web/"
          chmod 0755 "${artifact_dir}/remote-codex"
          (cd "${artifact_dir}" && sha256sum remote-codex > SHA256SUMS)
          asset_path="$(sed -n 's#.*src="\(/assets/index-[^"]*\.js\)".*#\1#p' "${artifact_dir}/web/index.html" | head -n 1)"
          test -n "${asset_path}"
          echo "asset_path=${asset_path}" >> "${GITHUB_OUTPUT}"
          tar -czf "${archive}" -C "${artifact_dir}" .

      - name: Upload Rust relay artifacts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_HOST }}
          username: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_USER }}
          password: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_PASSWORD }}
          port: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_PORT }}
          fingerprint: SHA256:SGclMsgdRESf26NGzeggwmGF9f3JKOsXsPjhxEMFXlM
          source: remote-codex-rust-relay-${{ github.sha }}.tgz
          target: /tmp

      - name: Replace only the Rust relay service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_HOST }}
          username: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_USER }}
          password: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_PASSWORD }}
          port: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_PORT }}
          fingerprint: SHA256:SGclMsgdRESf26NGzeggwmGF9f3JKOsXsPjhxEMFXlM
          timeout: 60m
          command_timeout: 20m
          script: |
            set -euo pipefail

            sha='${{ github.sha }}'
            archive="/tmp/remote-codex-rust-relay-${sha}.tgz"
            base='/opt/remote-codex-rust-relay'
            service='remote-codex-rust-relay.service'
            health_url='http://127.0.0.1:18791/healthz'
            expected_asset='${{ steps.package.outputs.asset_path }}'
            stage="${base}/releases/${sha}"
            backup="${base}/rollback-$(date -u +%Y%m%dT%H%M%SZ)"
            failed="${base}/failed-${sha}"

            unit="$(sudo systemctl cat "${service}")"
            printf '%s' "${unit}" | grep -Fq 'remote.lnz-study.com'
            printf '%s' "${unit}" | grep -Fq 'ExecStart=/opt/remote-codex-rust-relay/remote-codex relay'
            grep -Fxq 'HOST=127.0.0.1' "${base}/relay.env"
            grep -Fxq 'PORT=18791' "${base}/relay.env"
            grep -Fxq 'REMOTE_CODEX_RELAY_DATA_DIR=/var/lib/remote-codex-rust-relay' "${base}/relay.env"
            grep -Fxq 'REMOTE_CODEX_RELAY_WEB_DIST_DIR=/opt/remote-codex-rust-relay/web' "${base}/relay.env"
            test -f "${archive}"

            node_container_before="$(sudo docker inspect --format '{{.Id}}' remote-codex-relay)"
            mkdir -p "${stage}" "${backup}"
            tar -xzf "${archive}" -C "${stage}"
            (cd "${stage}" && sha256sum --check SHA256SUMS)
            file "${stage}/remote-codex" | grep -Eq 'x86-64|x86_64'
            test -f "${stage}/web/index.html"
            grep -Fq '#171713' "${stage}/web/index.html"

            rollback() {
              deployment_active='false'
              trap - EXIT
              rollback_status=0
              sudo systemctl stop "${service}" >/dev/null 2>&1 || true
              mkdir -p "${failed}"
              if [ -e "${base}/remote-codex" ]; then
                mv "${base}/remote-codex" "${failed}/remote-codex" || rollback_status=1
              fi
              if [ -e "${base}/web" ]; then
                mv "${base}/web" "${failed}/web" || rollback_status=1
              fi
              mv "${backup}/remote-codex" "${base}/remote-codex" || rollback_status=1
              mv "${backup}/web" "${base}/web" || rollback_status=1
              sudo systemctl start "${service}" || rollback_status=1

              restored='false'
              for _ in $(seq 1 30); do
                if curl -fsS "${health_url}" >/dev/null; then
                  restored='true'
                  break
                fi
                sleep 2
              done
              if [ "${restored}" != 'true' ]; then
                sudo journalctl -u "${service}" -n 120 --no-pager || true
                rollback_status=1
              fi
              return "${rollback_status}"
            }

            handle_exit() {
              status="$?"
              trap - EXIT
              if [ "${deployment_active}" = 'true' ]; then
                rollback || status=2
              fi
              exit "${status}"
            }

            deployment_active='false'
            sudo systemctl stop "${service}"
            mv "${base}/remote-codex" "${backup}/remote-codex"
            if ! mv "${base}/web" "${backup}/web"; then
              mv "${backup}/remote-codex" "${base}/remote-codex"
              sudo systemctl start "${service}"
              exit 1
            fi
            deployment_active='true'
            trap handle_exit EXIT
            chmod 0755 "${stage}/remote-codex"
            mv "${stage}/remote-codex" "${base}/.remote-codex-${sha}.next"
            mv "${base}/.remote-codex-${sha}.next" "${base}/remote-codex"
            mv "${stage}/web" "${base}/.web-${sha}.next"
            mv "${base}/.web-${sha}.next" "${base}/web"

            sudo systemctl start "${service}"

            healthy='false'
            for attempt in $(seq 1 45); do
              if curl -fsS "${health_url}" >/dev/null; then
                healthy='true'
                break
              fi
              sleep 2
            done
            if [ "${healthy}" != 'true' ]; then
              sudo journalctl -u "${service}" -n 120 --no-pager || true
              exit 1
            fi

            node_container_after="$(sudo docker inspect --format '{{.Id}}' remote-codex-relay)"
            test "${node_container_after}" = "${node_container_before}"

            public_ready='false'
            for attempt in $(seq 1 30); do
              public_html="$(curl -fsS https://remote.lnz-study.com/ || true)"
              public_health="$(curl -fsS https://remote.lnz-study.com/healthz || true)"
              public_asset="$(printf '%s' "${public_html}" | sed -n 's#.*src="\(/assets/index-[^"]*\.js\)".*#\1#p' | head -n 1)"
              if [ "${public_asset}" = "${expected_asset}" ] \
                && printf '%s' "${public_health}" | grep -Fq '"status":"ok"' \
                && printf '%s' "${public_health}" | grep -Eq '"supervisorCount":[1-9][0-9]*'; then
                public_ready='true'
                break
              fi
              sleep 2
            done
            if [ "${public_ready}" != 'true' ]; then
              exit 1
            fi

            sudo systemctl --no-pager --full status "${service}"
            curl -fsS "${health_url}"
            deployment_active='false'
            trap - EXIT

      - name: Verify the public Rust relay and legacy isolation
        shell: bash
        run: |
          set -euo pipefail

          expected_asset='${{ steps.package.outputs.asset_path }}'
          target_asset=''
          target_health=''
          for _ in $(seq 1 45); do
            target_html="$(curl -fsS https://remote.lnz-study.com/ || true)"
            target_asset="$(printf '%s' "${target_html}" | sed -n 's#.*src="\(/assets/index-[^"]*\.js\)".*#\1#p' | head -n 1)"
            target_health="$(curl -fsS https://remote.lnz-study.com/healthz || true)"
            if [ "${target_asset}" = "${expected_asset}" ] \
              && printf '%s' "${target_health}" | jq -e '.status == "ok" and .supervisorCount >= 1' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          test "${target_asset}" = "${expected_asset}"
          printf '%s' "${target_health}" | jq -e '.status == "ok" and .supervisorCount >= 1' >/dev/null

          legacy_ready='false'
          legacy_asset=''
          for _ in $(seq 1 15); do
            legacy_html="$(curl -fsS https://remote-codex.lnz-study.com/ || true)"
            legacy_asset="$(printf '%s' "${legacy_html}" | sed -n 's#.*src="\(/assets/index-[^"]*\.js\)".*#\1#p' | head -n 1)"
            legacy_health="$(curl -fsS https://remote-codex.lnz-study.com/healthz || true)"
            if [ "${legacy_asset}" = '${{ steps.before.outputs.legacy_asset }}' ] \
              && printf '%s' "${legacy_health}" | jq -e '.status == "ok"' >/dev/null 2>&1; then
              legacy_ready='true'
              break
            fi
            sleep 2
          done
          test "${legacy_ready}" = 'true'

          printf 'Rust relay asset: %s\n' "${target_asset}"
          printf 'Legacy relay asset unchanged: %s\n' "${legacy_asset}"
