name: Relay Deploy

on:
  workflow_dispatch:
    inputs:
      thread_ui_sha:
        description: Full commit SHA from remote-codex-thread-ui-rust
        required: true
        type: string
      deploy:
        description: Replace the public relay after building (disable for a build-only check)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: relay-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: github.ref == 'refs/heads/main'
    name: Build relay native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUST_VERSION: 1.89.0
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "${RUST_VERSION}" --profile minimal
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: relay-ubuntu24-x64-release
          cmd-format: rustup run ${{ env.RUST_VERSION }} {0}
      - name: Build and smoke native executable
        run: |
          cargo +"${RUST_VERSION}" build --locked --release --package remote-codex
          target/release/remote-codex version
      - uses: actions/upload-artifact@v4
        with:
          name: relay-native
          path: target/release/remote-codex
          if-no-files-found: error
          retention-days: 3

  web:
    if: github.ref == 'refs/heads/main'
    name: Build relay Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned shared UI
        uses: actions/checkout@v6
        with:
          repository: dufangshi/remote-codex-thread-ui-rust
          ref: ${{ inputs.thread_ui_sha }}
          path: remote-codex-thread-ui
      - name: Validate shared UI revision
        env:
          THREAD_UI_SHA: ${{ inputs.thread_ui_sha }}
        run: |
          [[ "${THREAD_UI_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C remote-codex-thread-ui rev-parse HEAD)" = "${THREAD_UI_SHA}"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            remote-codex-thread-ui/pnpm-lock.yaml
      - name: Build Web assets
        run: |
          pnpm --dir remote-codex-thread-ui install --frozen-lockfile
          pnpm --dir remote-codex-thread-ui --filter @remote-codex/thread-ui build
          pnpm --filter @remote-codex/supervisor-web... install --frozen-lockfile
          pnpm --filter @remote-codex/supervisor-web build
      - uses: actions/upload-artifact@v4
        with:
          name: relay-web
          path: apps/supervisor-web/dist/
          if-no-files-found: error
          retention-days: 3

  deploy-rust-rewrite:
    if: github.ref == 'refs/heads/main'
    needs: [native, web]
    name: Deploy Rust relay to remote.lnz-study.com
    runs-on: ubuntu-24.04
    environment: relay-rust-canary
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate shared UI revision
        env:
          THREAD_UI_SHA: ${{ inputs.thread_ui_sha }}
        run: |
          [[ "${THREAD_UI_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full UI SHA is required' >&2; exit 1; }
          echo "Runtime: ${GITHUB_SHA}; shared UI: ${THREAD_UI_SHA}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Capture deployment boundaries
        if: inputs.deploy
        id: before
        shell: bash
        run: |
          set -euo pipefail
          legacy_html="$(curl -fsS --max-time 20 https://remote-codex.lnz-study.com/)"
          legacy_asset="$(printf '%s' "${legacy_html}" | sed -n 's#.*src="\(/assets/index-[^"]*\.js\)".*#\1#p' | head -n 1)"
          legacy_health_code="$(curl -sS --max-time 20 -o legacy-health.json -w '%{http_code}' https://remote-codex.lnz-study.com/healthz)"
          if [ -n "${legacy_asset}" ]; then
            test "${legacy_health_code}" = '200'
            jq -e '.status == "ok"' legacy-health.json >/dev/null
            legacy_mode='active'
          else
            # The retired hostname may intentionally point at NPM's default site.
            # Accept that specific baseline, not an arbitrary unhealthy legacy app.
            printf '%s' "${legacy_html}" | grep -Fq '<title>Default Site</title>'
            printf '%s' "${legacy_html}" | grep -Fq 'Nginx Proxy Manager'
            test "${legacy_health_code}" = '404'
            legacy_mode='retired'
          fi
          legacy_html_sha="$(printf '%s' "${legacy_html}" | sha256sum | awk '{print $1}')"
          echo "legacy_mode=${legacy_mode}" >> "${GITHUB_OUTPUT}"
          echo "legacy_html_sha=${legacy_html_sha}" >> "${GITHUB_OUTPUT}"
          echo "legacy_asset=${legacy_asset}" >> "${GITHUB_OUTPUT}"

      - name: Verify Rust relay deployment host
        if: inputs.deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_HOST }}
          username: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_USER }}
          password: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_PASSWORD }}
          port: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_PORT }}
          fingerprint: SHA256:XCQeaNxZRFdwDbMHDnIviKL6oST7O9st0OhBj734WLw
          timeout: 60s
          command_timeout: 60s
          script: |
            set -euo pipefail
            test "$(hostname)" = 'vps-0e6cee34'
            sudo systemctl cat remote-codex-rust-relay.service | grep -Fq 'remote.lnz-study.com'
            sudo systemctl cat remote-codex-rust-relay.service | grep -Fq 'ExecStart=/opt/remote-codex-rust-relay/remote-codex relay'

      - uses: actions/download-artifact@v4
        with:
          name: relay-native
          path: rust-relay-artifact
      - uses: actions/download-artifact@v4
        with:
          name: relay-web
          path: rust-relay-artifact/web

      - name: Package Rust relay artifacts
        id: package
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="rust-relay-artifact"
          archive="remote-codex-rust-relay-${GITHUB_SHA}.tgz"

          chmod 0755 "${artifact_dir}/remote-codex"
          (cd "${artifact_dir}" && sha256sum remote-codex > SHA256SUMS)
          asset_path="$(sed -n 's#.*src="\(/assets/index-[^"]*\.js\)".*#\1#p' "${artifact_dir}/web/index.html" | head -n 1)"
          test -n "${asset_path}"
          echo "asset_path=${asset_path}" >> "${GITHUB_OUTPUT}"
          tar -czf "${archive}" -C "${artifact_dir}" .

      - name: Preserve build-only package
        if: ${{ !inputs.deploy }}
        uses: actions/upload-artifact@v4
        with:
          name: relay-package
          path: remote-codex-rust-relay-${{ github.sha }}.tgz
          retention-days: 3

      - name: Upload Rust relay artifacts
        if: inputs.deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_HOST }}
          username: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_USER }}
          password: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_PASSWORD }}
          port: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_PORT }}
          fingerprint: SHA256:XCQeaNxZRFdwDbMHDnIviKL6oST7O9st0OhBj734WLw
          source: remote-codex-rust-relay-${{ github.sha }}.tgz
          target: /tmp

      - name: Replace only the Rust relay service
        if: inputs.deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_HOST }}
          username: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_USER }}
          password: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_PASSWORD }}
          port: ${{ secrets.REMOTE_CODEX_RELAY_DEPLOY_PORT }}
          fingerprint: SHA256:XCQeaNxZRFdwDbMHDnIviKL6oST7O9st0OhBj734WLw
          timeout: 60m
          command_timeout: 20m
          script: |
            set -euo pipefail

            sha='${{ github.sha }}'
            archive="/tmp/remote-codex-rust-relay-${sha}.tgz"
            base='/opt/remote-codex-rust-relay'
            service='remote-codex-rust-relay.service'
            health_url='http://127.0.0.1:18791/healthz'
            expected_asset='${{ steps.package.outputs.asset_path }}'
            release_id="${sha}-${{ github.run_id }}-${{ github.run_attempt }}"
            stage="${base}/releases/${release_id}"
            backup="${base}/rollback-${release_id}"
            failed="${base}/failed-${release_id}"
            next_binary="${base}/.remote-codex-${release_id}.next"
            next_web="${base}/.web-${release_id}.next"

            unit="$(sudo systemctl cat "${service}")"
            printf '%s' "${unit}" | grep -Fq 'remote.lnz-study.com'
            printf '%s' "${unit}" | grep -Fq 'ExecStart=/opt/remote-codex-rust-relay/remote-codex relay'
            sudo grep -Fxq 'HOST=127.0.0.1' "${base}/relay.env"
            sudo grep -Fxq 'PORT=18791' "${base}/relay.env"
            sudo grep -Fxq 'REMOTE_CODEX_RELAY_DATA_DIR=/var/lib/remote-codex-rust-relay' "${base}/relay.env"
            sudo grep -Fxq 'REMOTE_CODEX_RELAY_WEB_DIST_DIR=/opt/remote-codex-rust-relay/web' "${base}/relay.env"
            # Fail before stopping the old service if the auth migration is misconfigured.
            sudo python3 - "${base}/relay.env" <<'PYPREFLIGHT'
            import pathlib, shlex, sys
            values = {}
            for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
                if '=' not in line or line.lstrip().startswith('#'):
                    continue
                key, raw = line.split('=', 1)
                parts = shlex.split(raw, comments=True)
                values[key.strip()] = parts[0] if parts else ''
            secret = values.get('REMOTE_CODEX_RELAY_SESSION_SECRET')
            if secret is not None and len(secret) < 32:
                raise SystemExit('Relay auth preflight: session secret must be at least 32 characters')
            if values.get('REMOTE_CODEX_PUBLIC_BASE_URL', '').rstrip('/') != 'https://remote.lnz-study.com':
                raise SystemExit('Relay auth preflight: configure the public HTTPS origin for Passkeys and OAuth')
            PYPREFLIGHT
            test -f "${archive}"
            test -x "${base}/remote-codex"
            test -d "${base}/web"

            node_container_before="$(sudo docker ps --all --no-trunc --filter 'name=^/remote-codex-relay$' --format '{{.ID}}')"
            old_binary_sha="$(sha256sum "${base}/remote-codex" | awk '{print $1}')"
            old_asset="$(sed -n 's#.*src="\(/assets/index-[^"]*\.js\)".*#\1#p' "${base}/web/index.html" | head -n 1)"
            test -n "${old_asset}"
            mkdir -p "${stage}" "${backup}"
            tar -xzf "${archive}" -C "${stage}"
            (cd "${stage}" && sha256sum --check SHA256SUMS)
            file "${stage}/remote-codex" | grep -Eq 'x86-64|x86_64'
            test -f "${stage}/web/index.html"
            grep -Fq '#171713' "${stage}/web/index.html"

            rollback() {
              deployment_active='false'
              trap - EXIT
              rollback_status=0
              if ! sudo systemctl stop "${service}"; then
                sudo journalctl -u "${service}" -n 120 --no-pager || true
                return 1
              fi
              if sudo systemctl is-active --quiet "${service}"; then
                sudo journalctl -u "${service}" -n 120 --no-pager || true
                return 1
              fi

              mkdir -p "${failed}"
              if [ -e "${backup}/remote-codex" ]; then
                if [ -e "${base}/remote-codex" ]; then
                  mv "${base}/remote-codex" "${failed}/remote-codex" || rollback_status=1
                fi
                mv "${backup}/remote-codex" "${base}/remote-codex" || rollback_status=1
              fi
              if [ -e "${backup}/web" ]; then
                if [ -e "${base}/web" ]; then
                  mv "${base}/web" "${failed}/web" || rollback_status=1
                fi
                mv "${backup}/web" "${base}/web" || rollback_status=1
              fi
              test -x "${base}/remote-codex" || rollback_status=1
              test -d "${base}/web" || rollback_status=1
              sudo systemctl start "${service}" || rollback_status=1

              restored='false'
              for _ in $(seq 1 30); do
                if curl -fsS "${health_url}" >/dev/null; then
                  restored='true'
                  break
                fi
                sleep 2
              done
              if [ "${restored}" != 'true' ]; then
                sudo journalctl -u "${service}" -n 120 --no-pager || true
                rollback_status=1
              fi
              if [ -x "${base}/remote-codex" ]; then
                restored_binary_sha="$(sha256sum "${base}/remote-codex" | awk '{print $1}')"
                test "${restored_binary_sha}" = "${old_binary_sha}" || rollback_status=1
              else
                rollback_status=1
              fi
              if [ -f "${base}/web/index.html" ]; then
                restored_asset="$(sed -n 's#.*src="\(/assets/index-[^"]*\.js\)".*#\1#p' "${base}/web/index.html" | head -n 1)"
                test "${restored_asset}" = "${old_asset}" || rollback_status=1
              else
                rollback_status=1
              fi
              return "${rollback_status}"
            }

            handle_exit() {
              status="$?"
              trap - EXIT
              if [ "${deployment_active}" = 'true' ]; then
                rollback || status=2
              fi
              exit "${status}"
            }

            deployment_active='false'
            trap handle_exit EXIT
            deployment_active='true'
            sudo systemctl stop "${service}"
            # Preserve authentication state and its encryption key before schema migration.
            # Keep these files root-only: old snapshots may contain legacy device tokens.
            sudo install -d -m 0700 "${backup}/relay-data"
            sudo install -m 0600 "${base}/relay.env" "${backup}/relay-data/relay.env"
            sudo python3 - "${backup}/relay-data" <<'PYBACKUP'
            import os, pathlib, shutil, sqlite3, sys
            source = pathlib.Path('/var/lib/remote-codex-rust-relay')
            destination = pathlib.Path(sys.argv[1])
            os.umask(0o077)
            for name in ('relay-store.sqlite', 'relay.sqlite'):
                path = source / name
                if path.is_file():
                    with sqlite3.connect(f'file:{path}?mode=ro', uri=True) as original:
                        with sqlite3.connect(destination / name) as snapshot:
                            original.backup(snapshot)
            secret = source / 'session-secret'
            if secret.is_file():
                shutil.copyfile(secret, destination / 'session-secret')
            PYBACKUP
            mv "${base}/remote-codex" "${backup}/remote-codex"
            mv "${base}/web" "${backup}/web"
            chmod 0755 "${stage}/remote-codex"
            mv "${stage}/remote-codex" "${next_binary}"
            mv "${next_binary}" "${base}/remote-codex"
            mv "${stage}/web" "${next_web}"
            mv "${next_web}" "${base}/web"

            sudo systemctl start "${service}"

            healthy='false'
            for _ in $(seq 1 45); do
              if curl -fsS "${health_url}" >/dev/null; then
                healthy='true'
                break
              fi
              sleep 2
            done
            if [ "${healthy}" != 'true' ]; then
              sudo journalctl -u "${service}" -n 120 --no-pager || true
              exit 1
            fi

            node_container_after="$(sudo docker ps --all --no-trunc --filter 'name=^/remote-codex-relay$' --format '{{.ID}}')"
            test "${node_container_after}" = "${node_container_before}"

            public_ready='false'
            for _ in $(seq 1 30); do
              public_html="$(curl -fsS https://remote.lnz-study.com/ || true)"
              public_health="$(curl -fsS https://remote.lnz-study.com/healthz || true)"
              public_asset="$(printf '%s' "${public_html}" | sed -n 's#.*src="\(/assets/index-[^"]*\.js\)".*#\1#p' | head -n 1)"
              if [ "${public_asset}" = "${expected_asset}" ] \
                && printf '%s' "${public_health}" | grep -Fq '"status":"ok"'; then
                public_ready='true'
                break
              fi
              sleep 2
            done
            if [ "${public_ready}" != 'true' ]; then
              exit 1
            fi

            sudo systemctl --no-pager --full status "${service}"
            curl -fsS "${health_url}"
            deployment_active='false'
            trap - EXIT

      - name: Verify the public Rust relay and legacy isolation
        if: inputs.deploy
        shell: bash
        env:
          LEGACY_MODE: ${{ steps.before.outputs.legacy_mode }}
          LEGACY_HTML_SHA: ${{ steps.before.outputs.legacy_html_sha }}
          LEGACY_ASSET: ${{ steps.before.outputs.legacy_asset }}
        run: |
          set -euo pipefail

          expected_asset='${{ steps.package.outputs.asset_path }}'
          target_asset=''
          target_health=''
          for _ in $(seq 1 45); do
            target_html="$(curl -fsS https://remote.lnz-study.com/ || true)"
            target_asset="$(printf '%s' "${target_html}" | sed -n 's#.*src="\(/assets/index-[^"]*\.js\)".*#\1#p' | head -n 1)"
            target_health="$(curl -fsS https://remote.lnz-study.com/healthz || true)"
            if [ "${target_asset}" = "${expected_asset}" ] \
              && printf '%s' "${target_health}" | jq -e '.status == "ok"' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          test "${target_asset}" = "${expected_asset}"
          printf '%s' "${target_health}" | jq -e '.status == "ok"' >/dev/null

          legacy_ready='false'
          legacy_asset=''
          for _ in $(seq 1 15); do
            legacy_html="$(curl -fsS --max-time 20 https://remote-codex.lnz-study.com/ || true)"
            legacy_asset="$(printf '%s' "${legacy_html}" | sed -n 's#.*src="\(/assets/index-[^"]*\.js\)".*#\1#p' | head -n 1)"
            legacy_health_code="$(curl -sS --max-time 20 -o legacy-health.json -w '%{http_code}' https://remote-codex.lnz-study.com/healthz || true)"
            legacy_html_sha="$(printf '%s' "${legacy_html}" | sha256sum | awk '{print $1}')"
            if [ "${LEGACY_MODE}" = 'active' ] \
              && [ "${legacy_asset}" = "${LEGACY_ASSET}" ] \
              && [ "${legacy_health_code}" = '200' ] \
              && jq -e '.status == "ok"' legacy-health.json >/dev/null 2>&1; then
              legacy_ready='true'
              break
            elif [ "${LEGACY_MODE}" = 'retired' ] \
              && [ "${legacy_html_sha}" = "${LEGACY_HTML_SHA}" ] \
              && [ "${legacy_health_code}" = '404' ]; then
              legacy_ready='true'
              break
            fi
            sleep 2
          done
          test "${legacy_ready}" = 'true'

          printf 'Rust relay asset: %s\n' "${target_asset}"
          printf 'Legacy baseline unchanged (%s): %s\n' "${LEGACY_MODE}" "${legacy_asset:-default site}"
