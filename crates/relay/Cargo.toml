rand.workspace = true
reqwest.workspace = true
remote-codex-protocol.workspace = true
rusqlite = { workspace = true, features = ["backup"] }
scrypt = "0.11"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
