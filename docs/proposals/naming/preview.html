<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Naming candidates</title>
<style>
  @font-face { font-family: 'DM Sans'; font-weight: 400 700; src: url('../../../apps/supervisor-web/public/fonts/dm-sans-latin.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #0c0f11; color: #f4f7f6; padding: 40px; width: 1520px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { color: #a2afb9; font-size: 15px; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; margin-top: 28px; }
  .card { background: #0f1317; border: 1px solid #263038; border-radius: 18px; padding: 22px; position: relative; }
  .card.pick { border-color: #215240; background: linear-gradient(#102b23 0, #0f1317 55%); }
  .badge { position: absolute; top: 16px; right: 16px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #082016; background: #00cc76; padding: 4px 8px; border-radius: 999px; }
  .hero { width: 148px; height: 148px; display: block; }
  .sizes { display: flex; align-items: end; gap: 10px; margin-top: 16px; }
  .chip { display: flex; align-items: end; gap: 8px; padding: 8px; border-radius: 10px; }
  .chip.light { background: oklch(0.946 0.006 145); }
  .chip.dark { background: #1c242a; }
  .name { font-size: 26px; font-weight: 700; margin-top: 16px; letter-spacing: -0.01em; }
  .tag { color: #c1cad1; font-size: 14px; margin-top: 4px; line-height: 1.4; min-height: 40px; }
  .cli { margin-top: 10px; font: 13px ui-monospace, 'DejaVu Sans Mono', monospace; color: #00cc76; }
</style>
</head>
<body>
<h1>Naming candidates for Remote Codex</h1>
<p class="sub">Self-hosted, end-to-end encrypted control plane for native coding agents. Icons shown at 148 / 64 / 32 / 16 px on dark and light surfaces.</p>
<div class="grid" id="grid"></div>
<script>
const items = [
  ['flotilla', 'Flotilla', 'A fleet of coding agents, on machines you own.', 'flotilla thread wait', true],
  ['kiteline', 'Kiteline', 'Let your agents fly. Keep the line in your pocket.', 'kite thread wait', true],
  ['nightjar', 'Nightjar', 'Your agents work the night. You wake to results.', 'nightjar thread wait', true],
  ['pilothouse', 'Pilothouse', 'One bridge for every agent on every machine.', 'pilot thread wait'],
  ['mothership', 'Mothership', 'Dispatch agents across your machines from one place.', 'mship thread wait'],
  ['signalbox', 'Signalbox', 'Route work between agents like trains on a line.', 'signalbox thread wait'],
  ['longhaul', 'Longhaul', 'Agent runs that survive restarts, updates and you.', 'longhaul thread wait'],
  ['afield', 'Afield', 'Leave the desk. Your agents keep going.', 'afield thread wait'],
];
const grid = document.getElementById('grid');
for (const [id, name, tag, cli, pick] of items) {
  const src = `icons/${id}.svg`;
  const small = (bg) => `<div class="chip ${bg}">${[64, 32, 16].map(s => `<img src="${src}" width="${s}" height="${s}">`).join('')}</div>`;
  grid.insertAdjacentHTML('beforeend', `
    <div class="card${pick ? ' pick' : ''}">
      ${pick ? '<span class="badge">Recommended</span>' : ''}
      <img class="hero" src="${src}" alt="">
      <div class="sizes">${small('dark')}${small('light')}</div>
      <div class="name">${name}</div>
      <div class="tag">${tag}</div>
      <div class="cli">$ ${cli}</div>
    </div>`);
}
</script>
</body>
</html>
